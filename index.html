<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        body {
            margin: 0;
            padding: 50px 0;
            background-color: #3498db;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        .business-card {
            box-sizing: border-box;
            width: 1050px;
            height: 600px;
            margin: 0 auto;
            padding: 60px 80px;
            background-color: #ffffff;
            color: #333333;
            border: 3px solid #2c3e50;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .name {
            font-size: 56px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .title {
            font-size: 32px;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .divider {
            width: 150px;
            height: 4px;
            background-color: #34dbc5;
            margin-bottom: 40px;
            border-radius: 2px;
        }

        .contact-info {
            font-size: 28px;
            color: #000000;
            line-height: 1.8;
        }

        .email, .phone {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="business-card">
        <div class="name">Thanin chantarasukon</div>
        <div class="title">Web Developer</div>
        <div class="divider"></div>
        <div class="contact-info">
            <div class="email">thaninsun7447@gmail.com</div>
            <div class="phone">0928129999</div>
        </div>
    </div>

</body>
</html>
